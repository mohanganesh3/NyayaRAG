version: "3.9"

# NyayaRAG Production Infrastructure
# Brings up PostgreSQL 16, Qdrant, and Neo4j for the full RAG architecture.
# Usage: docker compose up -d
# Check health: docker compose ps

services:

  # ─────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — Primary document store (12M+ LegalDocument records)
  # ─────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nyayarag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyayarag
      POSTGRES_PASSWORD: nyayarag_dev_password
      POSTGRES_DB: nyayarag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayarag -d nyayarag"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=4GB
        -c effective_cache_size=12GB
        -c maintenance_work_mem=2GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=64MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c work_mem=64MB
        -c huge_pages=off

  # ─────────────────────────────────────────────────────────────────────
  # Qdrant — Vector store for dense semantic search (12M+ chunks)
  # ─────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: nyayarag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (faster bulk upserts)
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # Neo4j 5 — Citation graph (FOLLOWS / OVERRULES / DISTINGUISHES edges)
  # ─────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: nyayarag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt (application driver)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/nyayarag_dev_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 8G
      NEO4J_dbms_memory_pagecache_size: 4G
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────
  # Redis — Celery task queue for background ingestion jobs
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nyayarag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
